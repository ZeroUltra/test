<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled Christmas Tree</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; p-20;
        }

        .header {
            padding: 20px;
            color: #d4af37; /* Gold */
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            text-align: center;
        }
        
        h1 { margin: 0; font-weight: 300; letter-spacing: 5px; text-transform: uppercase; }
        .status { font-size: 14px; color: #888; margin-top: 10px; }
        
        /* Controls & Instructions */
        .controls {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .instruction-card {
            background: rgba(0, 20, 10, 0.6);
            border: 1px solid #d4af37;
            padding: 15px;
            border-radius: 8px;
            color: #eee;
            font-size: 12px;
            line-height: 1.8;
            backdrop-filter: blur(5px);
        }

        .btn-upload {
            pointer-events: auto;
            background: linear-gradient(45deg, #8B0000, #b22222);
            color: white;
            border: 1px solid #d4af37;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
        }
        .btn-upload:hover { box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); transform: scale(1.05); }

        /* Video element for MediaPipe (Hidden) */
        #input_video { display: none; }
        
        /* Loading Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: #d4af37; transition: opacity 1s;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid #333;
            border-top: 3px solid #d4af37; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
                "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div>INITIALIZING AI & 3D ENGINE...</div>
    </div>

    <div id="ui-layer">
        <div class="header">
            <h1>Noël Lumière</h1>
            <div class="status" id="status-text">WAITING FOR HAND DETECTION...</div>
        </div>
        
        <div class="controls">
            <div class="instruction-card">
                <div>✊ <b>FIST:</b> Form Tree (Close)</div>
                <div>🖐 <b>OPEN:</b> Scatter Stars (Open)</div>
                <div>👋 <b>ROTATE:</b> Move Hand to Rotate</div>
                <div>👌 <b>PINCH:</b> Grab & Zoom Photo</div>
            </div>
            <div>
                <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
                <button class="btn-upload" onclick="document.getElementById('file-input').click()">+ Upload Memories</button>
            </div>
        </div>
    </div>

    <video id="input_video"></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- 1. Global Variables & Config ---
        const config = {
            colors: {
                matteGreen: 0x2F4F4F,
                gold: 0xFFD700,
                red: 0x8B0000,
                white: 0xFFFFFF
            },
            particleCount: 400,
            treeHeight: 30,
            treeRadius: 10
        };

        let scene, camera, renderer, composer;
        let particles = []; // Array to store our Particle objects
        let photoTextures = []; // Stores uploaded textures
        
        // State Management
        const STATES = { TREE: 'TREE', SCATTER: 'SCATTER', ZOOM: 'ZOOM' };
        let currentState = STATES.TREE;
        let targetRotation = { x: 0, y: 0 };
        let zoomTargetIndex = -1; // Which photo is zoomed

        // DOM Elements
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader');

        // --- 2. Three.js Setup ---
        function initThree() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 50);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.2;
            bloomPass.strength = 1.2; // Glow intensity
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(config.colors.gold, 2, 100);
            pointLight.position.set(0, 20, 10);
            scene.add(pointLight);

            // Golden directional light for shadows/highlights
            const dirLight = new THREE.DirectionalLight(config.colors.gold, 1);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', handleUpload);
        }

        // --- 3. Particle System Logic ---
        
        class Particle {
            constructor(mesh, type) {
                this.mesh = mesh;
                this.type = type; // 'decoration', 'photo'
                this.treePos = new THREE.Vector3();
                this.scatterPos = new THREE.Vector3();
                this.zoomPos = new THREE.Vector3(0, 15, 30); // Position when zoomed
                
                // Random scatter position
                this.scatterPos.x = (Math.random() - 0.5) * 80;
                this.scatterPos.y = (Math.random() - 0.5) * 60 + 10;
                this.scatterPos.z = (Math.random() - 0.5) * 50;
                
                // Initialize velocity for floating effect
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05
                );

                this.originalScale = mesh.scale.clone();
            }

            setTreePosition(i, total) {
                // Spiral Cone Algorithm
                const ratio = i / total;
                const angle = i * 0.5; // Spiral density
                const y = config.treeHeight * (1 - ratio) - (config.treeHeight/2);
                const r = config.treeRadius * ratio; 
                
                this.treePos.set(
                    Math.cos(angle) * r,
                    y + 15, // Lift tree up
                    Math.sin(angle) * r
                );
            }

            update(targetState, zoomIndex, myIndex) {
                let target;
                let moveSpeed = 0.05;

                if (targetState === STATES.TREE) {
                    target = this.treePos;
                    // Reset rotation slightly
                    this.mesh.rotation.x *= 0.95;
                    this.mesh.rotation.z *= 0.95;
                } else if (targetState === STATES.SCATTER) {
                    target = this.scatterPos;
                    // Add floating movement
                    this.scatterPos.add(this.velocity);
                    if(this.scatterPos.distanceTo(new THREE.Vector3(0,10,0)) > 60) this.velocity.negate();
                    
                    this.mesh.rotation.x += 0.01;
                    this.mesh.rotation.y += 0.01;
                } else if (targetState === STATES.ZOOM) {
                    if (myIndex === zoomIndex && this.type === 'photo') {
                        target = this.zoomPos;
                        this.mesh.lookAt(camera.position);
                        moveSpeed = 0.1;
                    } else {
                        // Others push back
                        target = this.scatterPos;
                    }
                }

                // Smooth Transition (Lerp)
                this.mesh.position.lerp(target, moveSpeed);

                // Handling Scale (Zoom effect)
                if (targetState === STATES.ZOOM && myIndex === zoomIndex && this.type === 'photo') {
                     this.mesh.scale.lerp(new THREE.Vector3(8, 8, 8), 0.1);
                } else {
                     this.mesh.scale.lerp(this.originalScale, 0.1);
                }
            }
        }

        function createParticles() {
            // Geometries
            const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const boxGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            
            // Materials
            const goldMat = new THREE.MeshPhysicalMaterial({ 
                color: config.colors.gold, metalness: 0.8, roughness: 0.2, clearcoat: 1 
            });
            const redMat = new THREE.MeshPhysicalMaterial({ 
                color: config.colors.red, metalness: 0.3, roughness: 0.6, emissive: 0x220000 
            });
            const greenMat = new THREE.MeshStandardMaterial({ 
                color: config.colors.matteGreen, roughness: 0.9 
            });

            // Create Decor Particles
            for (let i = 0; i < config.particleCount; i++) {
                let mesh;
                const rand = Math.random();
                if (rand > 0.6) mesh = new THREE.Mesh(sphereGeo, goldMat);
                else if (rand > 0.3) mesh = new THREE.Mesh(boxGeo, redMat);
                else mesh = new THREE.Mesh(sphereGeo, greenMat);

                scene.add(mesh);
                const p = new Particle(mesh, 'decoration');
                p.setTreePosition(i, config.particleCount);
                particles.push(p);
            }
        }

        function addPhotoToScene(texture) {
            const aspect = texture.image.width / texture.image.height;
            const geo = new THREE.PlaneGeometry(2 * aspect, 2);
            const mat = new THREE.MeshBasicMaterial({ 
                map: texture, side: THREE.DoubleSide 
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Start at camera
            mesh.position.copy(camera.position);
            mesh.position.z -= 10;
            
            scene.add(mesh);
            
            const p = new Particle(mesh, 'photo');
            // Insert into random spot in tree array to distribute
            const idx = Math.floor(Math.random() * particles.length);
            p.setTreePosition(idx, config.particleCount);
            
            particles.push(p);
            
            // Re-calculate tree positions for everyone to make room (optional, simplified here)
            // Just giving it a random tree target
            p.treePos.set(
                (Math.random()-0.5)*10,
                (Math.random())*20 + 5,
                (Math.random()-0.5)*10
            );
        }

        function handleUpload(e) {
            const files = e.target.files;
            if (!files.length) return;

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const texture = new THREE.Texture(img);
                        texture.needsUpdate = true;
                        texture.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(texture);
                    };
                };
                reader.readAsDataURL(file);
            }
            statusText.innerText = `${files.length} PHOTOS ADDED`;
        }

        // --- 4. MediaPipe Integration ---
        
        async function initMediaPipe() {
            // Dynamically load libraries from CDN if not detected (handled by importmap, but ensuring logic)
            const { Hands } = window; // Accessible if loaded via script tag, but here we use modules.
            // Since we used module imports, we need to access them differently if not using a bundler.
            // Let's rely on global script loading logic for MediaPipe which is simpler for single file without bundler.
        }

        // Helper: Logic to determine gesture
        function detectGesture(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            const wrist = landmarks[0];

            // 1. Check if Fist (All fingers curled)
            // Tip is closer to wrist than PIP (knuckle)
            const isFist = [8, 12, 16, 20].every(idx => {
                const tip = landmarks[idx];
                const pip = landmarks[idx - 2];
                return distance(tip, wrist) < distance(pip, wrist); 
            });

            if (isFist) return 'FIST';

            // 2. Check Pinch (Thumb and Index close)
            if (distance(thumbTip, indexTip) < 0.05) return 'PINCH';

            // 3. Check Open Hand
            const isOpen = [8, 12, 16, 20].every(idx => {
                const tip = landmarks[idx];
                const pip = landmarks[idx - 2];
                return distance(tip, wrist) > distance(pip, wrist); 
            });
            
            if (isOpen) return 'OPEN';

            return 'UNKNOWN';
        }

        function distance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onResults(results) {
            loader.style.opacity = 0; // Hide loader on first result
            setTimeout(() => loader.style.display = 'none', 1000);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const gesture = detectGesture(landmarks);

                // --- State Logic ---
                if (gesture === 'FIST') {
                    currentState = STATES.TREE;
                    statusText.innerText = "MODE: TREE (CLOSED)";
                    zoomTargetIndex = -1;
                } else if (gesture === 'OPEN') {
                    currentState = STATES.SCATTER;
                    statusText.innerText = "MODE: SCATTER (OPEN)";
                    zoomTargetIndex = -1;
                } else if (gesture === 'PINCH' && currentState === STATES.SCATTER) {
                    currentState = STATES.ZOOM;
                    statusText.innerText = "MODE: MEMORY ZOOM";
                    // If not already zooming a specific one, pick a photo
                    if (zoomTargetIndex === -1) {
                        // Find a random photo particle
                        const photoParticles = particles.map((p, i) => ({p, i})).filter(item => item.p.type === 'photo');
                        if (photoParticles.length > 0) {
                            // Pick the one closest to center of screen (optional, simplified to random here)
                            zoomTargetIndex = photoParticles[Math.floor(Math.random() * photoParticles.length)].i;
                        }
                    }
                }

                // --- Rotation Logic (Hand Position) ---
                if (currentState === STATES.SCATTER) {
                    // Map x (0-1) to rotation
                    const handX = landmarks[9].x; // Middle finger knuckle
                    const handY = landmarks[9].y;
                    
                    // Smooth lerp for camera rotation
                    targetRotation.x = (handX - 0.5) * 2; // -1 to 1
                    targetRotation.y = (handY - 0.5) * 1;
                }
            }
        }

        // --- 5. Main Loop ---
        
        function animate() {
            requestAnimationFrame(animate);

            // Rotate entire scene based on hand gesture
            if (scene) {
                scene.rotation.y += (targetRotation.x - scene.rotation.y) * 0.05;
                scene.rotation.x += (targetRotation.y - scene.rotation.x) * 0.05;
            }

            // Update Particles
            particles.forEach((p, index) => {
                p.update(currentState, zoomTargetIndex, index);
            });

            if(composer) composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Initialization Sequence ---
        async function main() {
            initThree();
            createParticles();
            
            // Load MediaPipe dynamically from CDN scripts
            // We use global scripts for MP to avoid complex bundler setup in single file
            const script1 = document.createElement('script');
            script1.src = "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.src = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
            
            script2.onload = () => {
                const videoElement = document.getElementById('input_video');
                const hands = new window.Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                hands.onResults(onResults);
                
                const camera = new window.Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                camera.start();
                animate(); // Start 3D loop after AI is ready-ish
            };
            document.head.appendChild(script2);
        }

        main();

    </script>
</body>
</html>
